# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/Overlay-Specification/refs/heads/main/schemas/v1.0/schema.yaml
overlay: 1.0.0
info:
  title: Overlay
  version: 1.0.0
actions:
  - target: $.paths
    update:
      /api/v1/environment/feature_flags:
        delete:
          operationId: DeleteEnvironmentFeatureFlagOverrides
        get:
          operationId: GetEnvironmentFeatureFlags
      /api/v1/environment/feature_flags/{feature_flag_key}:
        delete:
          operationId: DeleteEnvironmentFeatureFlagOverride
        patch:
          operationId: UpdateEnvironmentFeatureFlagOverride
